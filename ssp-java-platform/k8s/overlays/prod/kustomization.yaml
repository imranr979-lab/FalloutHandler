##############################################################################
# Production Overlay — Kustomize
# Increases replicas, sets prod image tags, tightens resource limits
##############################################################################
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ssp

bases:
  - ../../base

commonLabels:
  environment: production
  managed-by: kustomize

images:
  - name: ECR_REGISTRY/ssp-api-gateway
    newTag: PROD_IMAGE_TAG
  - name: ECR_REGISTRY/ssp-porting-service
    newTag: PROD_IMAGE_TAG
  - name: ECR_REGISTRY/ssp-notification-service
    newTag: PROD_IMAGE_TAG
  - name: ECR_REGISTRY/ssp-fallout-service
    newTag: PROD_IMAGE_TAG
  - name: ECR_REGISTRY/ssp-market-validation-service
    newTag: PROD_IMAGE_TAG
  - name: ECR_REGISTRY/ssp-auth-service
    newTag: PROD_IMAGE_TAG

patches:
  # Scale up replicas for production
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: porting-service

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: notification-service

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: fallout-service

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      name: market-validation-service

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: api-gateway

  # Production resource limits
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "500m"
            memory: "768Mi"
          limits:
            cpu: "2000m"
            memory: "1536Mi"
    target:
      kind: Deployment
      name: porting-service

  # Override ConfigMap for prod environment
  - patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: "kubernetes,production"
      - op: replace
        path: /data/LOG_LEVEL
        value: "WARN"
      - op: replace
        path: /data/PORTING_TABLE
        value: "ssp-porting-requests-prod"
      - op: replace
        path: /data/FALLOUT_TABLE
        value: "ssp-fallout-records-prod"
      - op: replace
        path: /data/NOTIFICATIONS_TABLE
        value: "ssp-notifications-prod"
      - op: replace
        path: /data/NPA_TABLE
        value: "ssp-npa-market-coverage-prod"
    target:
      kind: ConfigMap
      name: ssp-config
